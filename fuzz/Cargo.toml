[package]
name = "bo4e-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.rubo4e]
path = ".."
package = "rubo4e"
# `time` and `decimal` are in here deliberately: they replace `String` fields with
# `time::OffsetDateTime`, `time::Date`, and `rust_decimal::Decimal`, each of which
# runs a real parser over attacker-controlled text. Fuzzing without them exercised
# the one configuration where those parsers are not compiled in at all.
#
# `validate` for the same reason one level up: the cross-field validators run
# `Decimal` arithmetic over values that came straight off the wire, and that is
# where a panic hides — `Decimal::new` aborts above scale 28, which an amount in
# a payload can reach. Deserializing without then validating never touched it.
features = ["json", "versioned", "time", "decimal", "validate"]

[[bin]]
name = "fuzz_deserialize_vertrag"
path = "fuzz_targets/fuzz_deserialize_vertrag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_deserialize_marktlokation"
path = "fuzz_targets/fuzz_deserialize_marktlokation.rs"
test = false
doc = false
bench = false

